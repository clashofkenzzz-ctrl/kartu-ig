<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Card Generator</title>
  <!-- Library QR Code & Canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      margin-bottom: 24px;
    }
    h2 { margin: 0 0 8px; font-size: 22px; }
    p { font-size: 14px; color: #94a3b8; margin: 0 0 20px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f09433, #dc2743, #bc1888);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { opacity: 0.95; }
    .btn-download {
      background: #10b981;
      margin-top: 15px;
      display: none;
    }
    #previewContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    /* Tempat penampung QR sementara (disembunyikan) */
    #tempQr { display: none; }
  </style>
</head>
<body>

  <div class="panel">
    <h2>Instagram Card Maker</h2>
    <p>Masukkan link IG untuk menempelkan QR otomatis ke kartu cetak.</p>
    <input type="text" id="igInput" placeholder="https://www.instagram.com/username">
    <button onclick="generateCard()">Buat Desain Kartu</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadImage()">Download Gambar Siap Cetak</button>
  </div>

  <div id="previewContainer">
    <canvas id="cardCanvas"></canvas>
  </div>

  <!-- QR Generator Container -->
  <div id="tempQr"></div>

  <script>
    function generateCard() {
      let url = document.getElementById('igInput').value.trim();
      if (!url) {
        alert("Masukkan link profil Instagram!");
        return;
      }

      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }

      // Bersihkan QR lama
      const tempQr = document.getElementById('tempQr');
      tempQr.innerHTML = "";

      // 1. Generate QR Code berkualitas tinggi
      new QRCode(tempQr, {
        text: url,
        width: 600,
        height: 600,
        colorDark: "#1a1a1a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      // Tunggu library selesai merender QR ke tag image
      setTimeout(() => {
        const qrImage = tempQr.querySelector('img');
        if (qrImage) {
          drawCanvas(qrImage);
        }
      }, 300);
    }

    function drawCanvas(qrImage) {
      const canvas = document.getElementById('cardCanvas');
      const ctx = canvas.getContext('2d');
      const bgImg = new Image();

      // Memanggil file template desain
      bgImg.src = "template.jpg";

      bgImg.onload = function() {
        // Samakan ukuran canvas dengan resolusi asli gambar template
        canvas.width = bgImg.width;
        canvas.height = bgImg.height;

        // 1. Gambar desain background utama
        ctx.drawImage(bgImg, 0, 0);

        // 2. Tentukan posisi kotak QR (Disesuaikan dengan template kartu)
        // Posisi default berdasarkan proporsi layout gambar:
        const qrSize = canvas.width * 0.235; 
        const qrX = canvas.width * 0.585;
        const qrY = canvas.height * 0.627;

        // Beri lapisan latar putih halus di area QR
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(qrX, qrY, qrSize, qrSize);

        // 3. Tempel QR Code yang baru digenerate
        ctx.drawImage(qrImage, qrX, qrY, qrSize, qrSize);

        // Tampilkan tombol download
        document.getElementById('downloadBtn').style.display = "block";
      };

      bgImg.onerror = function() {
        alert("File 'template.jpg' tidak ditemukan di repository GitHub Anda. Pastikan sudah upload file gambar dengan nama persis template.jpg.");
      };
    }

    function downloadImage() {
      const canvas = document.getElementById('cardCanvas');
      const link = document.createElement('a');
      link.download = 'kartu-instagram-siap-cetak.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
