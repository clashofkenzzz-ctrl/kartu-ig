<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Card Generator</title>
  <!-- Library QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: left;
      margin-bottom: 24px;
      box-sizing: border-box;
    }
    h2 { margin: 0 0 8px; font-size: 20px; text-align: center; }
    p.desc { font-size: 13px; color: #94a3b8; margin: 0 0 20px; text-align: center; }
    label { font-size: 13px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px; }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="file"] {
      padding: 9px;
      cursor: pointer;
    }
    input:focus { border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #f09433, #dc2743, #bc1888);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 5px;
    }
    button:hover { opacity: 0.92; }
    .btn-download {
      background: #10b981;
      margin-top: 15px;
      display: none;
    }
    #previewContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    #tempQr { display: none; }
  </style>
</head>
<body>

  <div class="panel">
    <h2>Instagram Card Maker</h2>
    <p class="desc">Buat kartu Instagram dengan QR otomatis siap cetak.</p>

    <label>1. Pilih Desain Kartu (Gambar Template Anda):</label>
    <input type="file" id="bgInput" accept="image/*">

    <label>2. Masukkan Link Profil Instagram:</label>
    <input type="text" id="igInput" placeholder="https://www.instagram.com/username">

    <button onclick="generateCard()">Generate Kartu</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadImage()">Download Hasil Desain (Siap Cetak)</button>
  </div>

  <div id="previewContainer">
    <canvas id="cardCanvas"></canvas>
  </div>

  <div id="tempQr"></div>

  <script>
    let uploadedImage = null;

    // Baca file gambar yang dipilih user
    document.getElementById('bgInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          uploadedImage = new Image();
          uploadedImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function generateCard() {
      if (!uploadedImage) {
        alert("Pilih gambar desain kartu Anda terlebih dahulu di kolom nomor 1!");
        return;
      }

      let url = document.getElementById('igInput').value.trim();
      if (!url) {
        alert("Masukkan link profil Instagram!");
        return;
      }

      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }

      const tempQr = document.getElementById('tempQr');
      tempQr.innerHTML = "";

      // Buat QR Code resolusi tinggi
      new QRCode(tempQr, {
        text: url,
        width: 800,
        height: 800,
        colorDark: "#1a1a1a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      setTimeout(() => {
        const qrImage = tempQr.querySelector('img');
        if (qrImage) {
          drawCanvas(qrImage);
        }
      }, 300);
    }

    function drawCanvas(qrImage) {
      const canvas = document.getElementById('cardCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = uploadedImage.width;
      canvas.height = uploadedImage.height;

      // 1. Tempel Background Desain
      ctx.drawImage(uploadedImage, 0, 0);

      // 2. Posisi Kotak QR (Sesuai proporsi desain kartu)
      const qrSize = canvas.width * 0.235;
      const qrX = canvas.width * 0.585;
      const qrY = canvas.height * 0.627;

      // Kotak latar putih di balik QR
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(qrX, qrY, qrSize, qrSize);

      // 3. Tempel QR Code
      ctx.drawImage(qrImage, qrX, qrY, qrSize, qrSize);

      // Munculkan tombol download
      document.getElementById('downloadBtn').style.display = "block";
    }

    function downloadImage() {
      const canvas = document.getElementById('cardCanvas');
      const link = document.createElement('a');
      link.download = 'kartu-instagram-ready.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
