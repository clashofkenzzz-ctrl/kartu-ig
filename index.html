<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Instagram Card - Dot-Pattern</title>
  
  <!-- Library QR Code Custom (Dot Pattern) -->
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: left;
      margin-bottom: 24px;
      box-sizing: border-box;
    }
    h2 { margin: 0 0 8px; font-size: 20px; text-align: center; }
    p.desc { font-size: 13px; color: #94a3b8; margin: 0 0 20px; text-align: center; }
    label { font-size: 13px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #f09433, #dc2743, #bc1888);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 5px;
    }
    button:hover { opacity: 0.92; }
    .btn-download {
      background: #10b981;
      margin-top: 15px;
      display: none;
    }
    #previewContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    /* Tempat penampung QR (disembunyikan) */
    #qrContainer { display: none; }
  </style>
</head>
<body>

  <div class="panel">
    <h2>Smart Instagram Card</h2>
    <p class="desc">Buat kartu Instagram dengan QR titik-titik (dot-pattern) siap cetak.</p>

    <label>Masukkan Link Profil Instagram:</label>
    <input type="text" id="igInput" placeholder="https://www.instagram.com/username">

    <button onclick="generateCard()">Generate Kartu</button>
    <button id="downloadBtn" class="btn-download" onclick="downloadImage()">Download Gambar Siap Cetak</button>
  </div>

  <div id="previewContainer">
    <canvas id="cardCanvas"></canvas>
  </div>

  <!-- Container sementara untuk render QR -->
  <div id="qrContainer"></div>

  <script>
    const bgImage = new Image();
    bgImage.src = 'template.jpg'; // Mengambil gambar template yang sudah diupload

    let qrCodeStyling;

    function generateCard() {
      let url = document.getElementById('igInput').value.trim();
      if (!url) {
        alert("Masukkan link profil Instagram!");
        return;
      }

      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }

      // Bersihkan QR lama jika ada
      const container = document.getElementById('qrContainer');
      container.innerHTML = "";

      // 1. Konfigurasi QR Code Dot-Pattern (Gaya Titik-Titik)
      qrCodeStyling = new QRCodeStyling({
        width: 1000,
        height: 1000,
        data: url,
        margin: 0,
        type: "canvas",
        dotsOptions: {
          type: "dots", // GAYA TITIK-TITIK
          color: "#1a1a1a" // Warna titik (hitam pekat)
        },
        backgroundOptions: {
          color: "#ffffff" // Background kotak putih
        },
        imageOptions: {
          crossOrigin: "anonymous",
          margin: 10 // Jarak logo ke titik-titik
        },
        cornersSquareOptions: {
          type: "extra-rounded" // Sudut kotak luar
        },
        cornersDotOptions: {
          type: "dot" // Sudut titik dalam
        }
      });

      // 2. Tambahkan logo Instagram di tengah QR (Gaya Titik-Titik)
      // Gunakan logo Instagram resmi dengan background putih melingkar agar terlihat jelas.
      qrCodeStyling.update({
        image: "https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg"
      });

      // 3. Render QR code ke dalam container canvas
      qrCodeStyling.append(container);

      // 4. Tunggu render selesai lalu gabungkan ke template
      setTimeout(() => {
        const qrCanvas = container.querySelector('canvas');
        if (qrCanvas) {
          drawCanvas(qrCanvas);
        }
      }, 500);
    }

    function drawCanvas(qrCanvas) {
      const canvas = document.getElementById('cardCanvas');
      const ctx = canvas.getContext('2d');

      // Samakan resolusi canvas dengan resolusi asli gambar template
      canvas.width = bgImage.width;
      canvas.height = bgImage.height;

      // 1. Gambar desain background utama (Template Anda)
      ctx.drawImage(bgImage, 0, 0);

      // 2. Tentukan posisi kotak QR (Pas-in ke kotak putih desain Anda)
      // Koordinat ini didasarkan pada proporsi layout gambar template Anda.
      // Sesuai desain Anda[cite: 5]:
      const qrSize = canvas.width * 0.235; // Ukuran QR disesuaikan
      const qrX = canvas.width * 0.585;   // Posisi horizontal
      const qrY = canvas.height * 0.627;  // Posisi vertikal

      // Kotak latar putih halus di area QR (agar menimpa desain lama)
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(qrX, qrY, qrSize, qrSize);

      // 3. Tempel QR Code (Canvas) yang baru digenerate
      ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);

      // Tampilkan tombol download
      document.getElementById('downloadBtn').style.display = "block";
    }

    function downloadImage() {
      const canvas = document.getElementById('cardCanvas');
      const link = document.createElement('a');
      link.download = 'kartu-instagram-siap-cetak.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Pastikan template gambar sudah terload sebelum generate
    bgImage.onerror = function() {
        alert("File 'template.jpg' tidak ditemukan. Pastikan sudah upload file gambar dengan nama persis template.jpg ke GitHub.");
    };
  </script>
</body>
</html>
