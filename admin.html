<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Kontrol Kartu Instagram (Unlimited System)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .main-container {
      width: 100%;
      max-width: 980px;
    }
    .header-card {
      background: #151f32;
      border: 1px solid #1e293b;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .header-title h2 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 700;
    }
    .header-title p {
      margin: 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .header-status-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .db-count-badge {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .db-count-badge b { color: #38bdf8; }
    .btn-refresh {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    .btn-refresh:hover { opacity: 0.9; }

    .control-bar {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 14px 18px;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .input-small {
      width: 70px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      outline: none;
    }
    .input-search {
      width: 170px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .btn-apply {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-show {
      background: #e11d48;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-row {
      background: #151f32;
      border: 1px solid #1e293b;
      padding: 12px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .card-row:hover { border-color: #334155; }
    .card-id-tag {
      background: #e11d48;
      color: white;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      min-width: 75px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .status-tag {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      white-space: nowrap;
    }
    .status-tag.active {
      color: #34d399;
      border-color: #065f46;
      background: #022c22;
    }
    .input-url-box {
      flex: 1;
      min-width: 220px;
    }
    .input-url {
      width: 100%;
      background: #0b1120;
      border: 1px solid #1e293b;
      padding: 9px 14px;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    .input-url:focus { border-color: #38bdf8; }
    .actions-box {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-act-save { background: #059669; color: #fff; }
    .btn-act-reset { background: #475569; color: #cbd5e1; }
    .btn-act-open { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .global-notif {
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      font-weight: 600;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="header-card">
      <div class="header-top">
        <div class="header-title">
          <h2>Dashboard Kontrol Kartu Instagram (Unlimited System)</h2>
          <p>Kelola tautan kartu tanpa batasan jumlah ID.</p>
        </div>
        <div class="header-status-box">
          <div class="db-count-badge">Aktif di DB: <b id="activeCount">0</b></div>
          <button class="btn-refresh" onclick="loadAllData()">Segarkan DB</button>
        </div>
      </div>

      <div class="control-bar">
        <div class="control-group">
          <span>Tampilkan Urutan ID Sampai:</span>
          <input type="number" id="limitInput" class="input-small" value="24" min="1">
          <button class="btn-apply" onclick="applyLimit()">Terapkan Urutan</button>
        </div>

        <div class="control-group">
          <span>Buka/Cari ID Khusus:</span>
          <input type="text" id="customInput" class="input-search" placeholder="misal: 100 atau A0050">
          <button class="btn-show" onclick="showCustomCard()">Tampilkan</button>
        </div>
      </div>

      <div id="globalNotif" class="global-notif">Memuat data dari cloud...</div>
    </div>

    <div class="card-list" id="cardsList"></div>
  </div>

  <script>
    // ================= MASUKKAN KUNCI JSONBIN DI SINI =================
    const BIN_ID = "MASUKKAN_BIN_ID_ANDA_DISINI";
    const MASTER_KEY = "MASUKKAN_MASTER_KEY_ANDA_DISINI";
    // ===================================================================

    let allDatabase = {};
    let currentLimit = 24;
    let customCardsPinned = [];

    async function loadAllData() {
      const notif = document.getElementById('globalNotif');
      
      // Render kartu terlebih dahulu agar tidak kosong saat menunggu
      renderDashboard();

      if (BIN_ID.includes("MASUKKAN_") || MASTER_KEY.includes("MASUKKAN_")) {
        notif.style.color = '#ef4444';
        notif.innerText = "PERINGATAN: BIN_ID atau MASTER_KEY belum Anda masukkan di kode file admin.html!";
        return;
      }

      notif.style.color = '#38bdf8';
      notif.innerText = "Mengambil data terbaru dari cloud...";

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 
            "X-Master-Key": MASTER_KEY 
          }
        });
        
        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }

        const data = await res.json();
        allDatabase = data.record || {};

        // Hitung total aktif
        let activeTotal = 0;
        for (const k in allDatabase) {
          if (allDatabase[k] && allDatabase[k] !== "aktif") activeTotal++;
        }
        document.getElementById('activeCount').innerText = activeTotal;

        notif.style.color = '#10b981';
        notif.innerText = "Data berhasil dimuat. Siap digunakan.";
        renderDashboard(); // Render ulang dengan status data terbaru
      } catch (e) {
        notif.style.color = '#ef4444';
        notif.innerText = "Gagal koneksi database! Periksa apakah BIN_ID dan MASTER_KEY sudah benar.";
        console.error(e);
      }
    }

    function renderDashboard() {
      const container = document.getElementById('cardsList');
      container.innerHTML = "";

      for (let i = 1; i <= currentLimit; i++) {
        const id = "A" + String(i).padStart(4, '0');
        renderRow(id, container);
      }

      customCardsPinned.forEach(customId => {
        if (!document.getElementById(`row-${customId}`)) {
          renderRow(customId, container);
        }
      });
    }

    function renderRow(id, container) {
      const currentUrl = (allDatabase[id] && allDatabase[id] !== "aktif") ? allDatabase[id] : "";
      const isActive = Boolean(currentUrl);

      const row = document.createElement('div');
      row.className = 'card-row';
      row.id = `row-${id}`;

      row.innerHTML = `
        <div class="card-id-tag">ID: ${id}</div>
        <div class="status-tag ${isActive ? 'active' : ''}" id="statusTag-${id}">
          ${isActive ? '● Aktif' : '○ Kosong'}
        </div>
        <div class="input-url-box">
          <input type="text" class="input-url" id="input-${id}" 
                 value="${currentUrl}" 
                 placeholder="Belum diaktivasi (kosong)">
        </div>
        <div class="actions-box">
          <button class="btn-action btn-act-save" onclick="saveCard('${id}')">Simpan</button>
          <button class="btn-action btn-act-reset" onclick="resetCard('${id}')">Reset</button>
          <button class="btn-action btn-act-open" onclick="openCard('${id}')">Buka</button>
        </div>
      `;

      container.appendChild(row);
    }

    function applyLimit() {
      const val = parseInt(document.getElementById('limitInput').value, 10);
      if (isNaN(val) || val < 1) {
        alert("Masukkan angka yang valid!");
        return;
      }
      currentLimit = val;
      renderDashboard();
    }

    function showCustomCard() {
      let raw = document.getElementById('customInput').value.trim();
      if (!raw) {
        alert("Masukkan nomor atau kode kartu!");
        return;
      }

      let formattedId = raw.toUpperCase();
      if (/^\d+$/.test(formattedId)) {
        formattedId = "A" + String(parseInt(formattedId, 10)).padStart(4, '0');
      }

      if (!customCardsPinned.includes(formattedId)) {
        customCardsPinned.unshift(formattedId);
      }

      renderDashboard();

      const el = document.getElementById(`row-${formattedId}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.borderColor = '#e11d48';
      }
    }

    async function saveCard(id) {
      let val = document.getElementById(`input-${id}`).value.trim();
      const notif = document.getElementById('globalNotif');

      if (!val) {
        alert("Tautan tidak boleh kosong! Jika ingin mengosongkan, gunakan tombol Reset.");
        return;
      }

      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        val = "https://" + val;
        document.getElementById(`input-${id}`).value = val;
      }

      notif.style.color = '#38bdf8';
      notif.innerText = `Menyimpan data kartu ${id}...`;

      allDatabase[id] = val;
      await syncCloud(`Berhasil menyimpan kartu ${id}!`, id, true);
    }

    async function resetCard(id) {
      if (!confirm(`Yakin ingin mengosongkan link untuk kartu ${id}?`)) return;

      const notif = document.getElementById('globalNotif');
      notif.style.color = '#38bdf8';
      notif.innerText = `Mereset kartu ${id}...`;

      delete allDatabase[id];
      document.getElementById(`input-${id}`).value = "";
      await syncCloud(`Kartu ${id} berhasil dikosongkan (reset)!`, id, false);
    }

    function openCard(id) {
      const url = `https://kartu-ig.vercel.app/?id=${id}`;
      window.open(url, '_blank');
    }

    async function syncCloud(successText, id, isActive) {
      const notif = document.getElementById('globalNotif');
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": MASTER_KEY
          },
          body: JSON.stringify(allDatabase)
        });

        const tag = document.getElementById(`statusTag-${id}`);
        if (tag) {
          tag.className = `status-tag ${isActive ? 'active' : ''}`;
          tag.innerText = isActive ? '● Aktif' : '○ Kosong';
        }

        let activeTotal = 0;
        for (const k in allDatabase) {
          if (allDatabase[k] && allDatabase[k] !== "aktif") activeTotal++;
        }
        document.getElementById('activeCount').innerText = activeTotal;

        notif.style.color = '#10b981';
        notif.innerText = successText;
      } catch (e) {
        notif.style.color = '#ef4444';
        notif.innerText = "Gagal memperbarui database cloud!";
      }
    }

    window.onload = loadAllData;
  </script>
