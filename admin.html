<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Kontrol Kartu Instagram (Unlimited System)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .main-container {
      width: 100%;
      max-width: 980px;
    }
    .header-card {
      background: #151f32;
      border: 1px solid #1e293b;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .header-title h2 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 700;
    }
    .header-title p {
      margin: 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .header-status-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .db-count-badge {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .db-count-badge b { color: #38bdf8; }
    .btn-refresh {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    .btn-refresh:hover { opacity: 0.9; }

    .control-bar {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 14px 18px;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .input-small {
      width: 70px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      outline: none;
    }
    .input-search {
      width: 170px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .btn-apply {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-show {
      background: #e11d48;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-row {
      background: #151f32;
      border: 1px solid #1e293b;
      padding: 12px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .card-row:hover { border-color: #334155; }
    .card-id-tag {
      background: #e11d48;
      color: white;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      min-width: 75px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .status-tag {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      white-space: nowrap;
    }
    .status-tag.active {
      color: #34d399;
      border-color: #065f46;
      background: #022c22;
    }
    .input-url-box {
      flex: 1;
      min-width: 220px;
    }
    .input-url {
      width: 100%;
      background: #0b1120;
      border: 1px solid #1e293b;
      padding: 9px 14px;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    .input-url:focus { border-color: #38bdf8; }
    .actions-box {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-act-save { background: #059669; color: #fff; }
    .btn-act-reset { background: #475569; color: #cbd5e1; }
    .btn-act-open { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .global-notif {
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      font-weight: 600;
      color: #38bdf8;
    }
  </style>
</head>
<body>

        <div class="header-status-box">

          <button class="btn-apply" onclick="applyLimit()">Terapkan Urutan</button>
        </div>

        <div class="control-group">
          <span>Buka/Cari ID Khusus:</span>
          <input type="text" id="customInput" class="input-search" placeholder="misal: 100 atau A0050">
          <button class="btn-show" onclick="showCustomCard()">Tampilkan</button>
        </div>
      </div>

      <div id="globalNotif" class="global-notif">Memuat data dari cloud...</div>
    </div>

    <div class="card-list" id="cardsList"></div>
  </div>
