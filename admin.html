<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard Kartu Dinamis</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-panel {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 760px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    h2 { margin: 0 0 6px; font-size: 22px; text-align: center; }
    p.desc { font-size: 13px; color: #94a3b8; margin: 0 0 16px; text-align: center; }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      margin-bottom: 14px;
    }
    .search-box:focus { border-color: #38bdf8; }
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #334155;
      padding-top: 14px;
    }
    .add-custom {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 240px;
    }
    .input-custom {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      outline: none;
      text-transform: uppercase;
    }
    .card-list {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-item {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .card-item:hover { border-color: #475569; }
    .card-badge-col {
      min-width: 110px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-code {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      width: fit-content;
    }
    .badge-active { background: #065f46; color: #34d399; }
    .badge-empty { background: #7f1d1d; color: #fca5a5; }
    .card-input-col {
      flex: 1;
      min-width: 220px;
    }
    .url-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    .url-input:focus { border-color: #38bdf8; }
    .card-btn-col {
      display: flex;
      gap: 8px;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    button:hover { opacity: 0.9; }
    .btn-save { background: #10b981; color: white; }
    .btn-reset { background: #ef4444; color: white; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-secondary { background: #475569; color: white; }
    .global-status {
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header-panel">
    <h2>Manajemen Kartu Smart NFC & QR</h2>
    <p class="desc">Daftar kartu akan otomatis bertambah saat nomor baru dibuat atau diaktifkan.</p>
